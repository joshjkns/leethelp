appId: dev.leethelp.app
productName: LeetHelp
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  # The assistant runs your installed Claude Code CLI, so the SDK's own platform binaries stay out.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target: [dmg]
  identity: "-"
  hardenedRuntime: false
# LeetCode's browser sign-in redirects to vscode-insiders:// (see openBrowserLogin in src/main/leetcode.ts).
# The app only makes itself the default handler while a sign-in is pending.
protocols:
  - name: LeetCode sign-in
    schemes: [vscode-insiders]

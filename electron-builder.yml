appId: dev.leethelp.app
productName: LeetHelp
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# The assistant's bundled claude binary can't run from inside the asar archive.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target: [dmg]
  identity: "-"
  hardenedRuntime: false
